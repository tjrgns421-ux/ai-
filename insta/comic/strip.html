<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blip Strip</title>
<style>
  @font-face { font-family: "Pretendard"; font-weight: 700; src: url("../fonts/Pretendard-Bold.woff2") format("woff2"); }
  @font-face { font-family: "Pretendard"; font-weight: 900; src: url("../fonts/Pretendard-Black.woff2") format("woff2"); }
  @font-face { font-family: "Hand"; src: url("../fonts/PatrickHand-Regular.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ddd; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #fff; margin-bottom: 20px; }
  .logo { position: absolute; left: 60px; top: 62px; font: 900 44px Pretendard; letter-spacing: -1px; color: #111; }
  .logo b { background: #111; color: #d7ff3a; border-radius: 10px; padding: 0 10px; margin-left: 6px; }
  .frame { position: absolute; border: 9px solid #111; border-radius: 6px; overflow: hidden; }
  .blip { position: absolute; }
  .blip img { width: 100%; height: 100%; object-fit: contain; }
  .bubble { position: absolute; background: #fff; border: 7px solid #111; border-radius: 26px; padding: 18px 24px; font: 400 64px/1.05 Hand; text-transform: uppercase; color: #111; text-align: center; }
  .bubble.top { left: -9px; right: -9px; top: -9px; border-radius: 0 0 30px 30px; } /* full-width speech box, like a strip header */
  .bubble svg { position: absolute; }
  .label { position: absolute; font: 400 40px Hand; text-transform: uppercase; color: #111; }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; border-top: 7px solid #111; }

  /* fact slide */
  .facts h2 { position: absolute; left: 60px; top: 150px; font: 400 84px/1 Hand; text-transform: uppercase; color: #111; }
  .facts h2 span { background: #d7ff3a; padding: 0 12px; }
  .facts ul { position: absolute; left: 60px; right: 60px; top: 345px; list-style: none; display: flex; flex-direction: column; gap: 18px; }
  .facts li { border: 6px solid #111; border-radius: 22px; padding: 18px 24px; font: 700 32px/1.33 Pretendard; color: #111; }
  .facts li .tag { display: inline-block; font: 900 22px Pretendard; letter-spacing: 1px; padding: 4px 10px; border-radius: 6px; margin-bottom: 8px; background: #d7ff3a; }
  .facts li .tag.plan { background: #ffc93a; }
  .facts li small { display: block; font: 700 22px Pretendard; color: #666; margin-top: 8px; }
  .facts .foot { position: absolute; left: 60px; right: 300px; bottom: 70px; font: 700 26px/1.4 Pretendard; color: #444; }
  .page { position: absolute; right: 60px; top: 74px; font: 700 26px Pretendard; color: #999; }

  /* hook slide: the unbelievable-but-true line, big */
  .hook { background: #fff; }
  .hook .h1 { position: absolute; left: 60px; right: 60px; top: 170px; font: 400 116px/1.0 Hand; text-transform: uppercase; color: #111; }
  .hook .h2 { position: absolute; left: 60px; top: 690px; font: 400 104px/1 Hand; text-transform: uppercase; color: #111; }
  .hook .h2 span { background: #d7ff3a; padding: 0 16px; border: 7px solid #111; border-radius: 14px; display: inline-block; rotate: -2deg; }
  .hook .true { position: absolute; left: 60px; bottom: 80px; font: 900 34px Pretendard; color: #111; }
  .hook .true b { background: #111; color: #d7ff3a; padding: 4px 12px; border-radius: 8px; margin-right: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const br = (s) => esc(s).replace(/\n/g, "<br>");
  const BLIP = (f) => `../../video/public/bc01/blip/${f}.png`;

  // panel layouts inside x 60–1020, y 130–1250 (gap 34)
  const L = {
    "2v":  [[60, 130, 960, 543], [60, 707, 960, 543]],
    "2+1": [[60, 130, 463, 543], [557, 130, 463, 543], [60, 707, 960, 543]],
    "2x2": [[60, 130, 463, 543], [557, 130, 463, 543], [60, 707, 463, 543], [557, 707, 463, 543]],
    "1":   [[60, 130, 960, 1120]],
  };

  // props drawn in code, positioned inside the panel
  const PROPS = {
    box: (p) => `<div style="position:absolute;left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;background:#c9965a;border:7px solid #111;border-radius:6px">
        <div style="position:absolute;left:0;right:0;top:${p.h * 0.32}px;text-align:center;font:400 ${p.size ?? 54}px Hand;color:#111">${esc(p.text ?? "")}</div></div>`,
    boxback: (p) => `<div style="position:absolute;left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;background:#a8773f;border:7px solid #111;border-radius:6px"></div>`,
    poster: (p) => `<div style="position:absolute;left:${p.x}px;top:${p.y}px;width:${p.w}px;background:#fff;border:7px solid #111;border-radius:8px;padding:16px;text-align:center;font:400 ${p.size ?? 46}px/1.05 Hand;text-transform:uppercase;color:#111;rotate:${p.rot ?? -2}deg">${br(p.text)}</div>`,
    phone: (p) => `<div style="position:absolute;left:${p.x}px;top:${p.y}px;width:${p.w ?? 90}px;height:${(p.w ?? 90) * 1.8}px;background:#222;border:6px solid #111;border-radius:18px;rotate:${p.rot ?? 0}deg"></div>`,
    pencil: (p) => `<div style="position:absolute;left:${p.x}px;top:${p.y}px;width:${p.w ?? 160}px;height:26px;background:#ffc93a;border:6px solid #111;border-radius:4px;rotate:${p.rot ?? -30}deg"></div>`,
    text: (p) => `<div class="label" style="left:${p.x}px;top:${p.y}px;font-size:${p.size ?? 40}px;rotate:${p.rot ?? 0}deg">${br(p.text)}</div>`,
    // ---- drawn props (SVG, thick ink outline, flat color). `w` scales each one. ----
    desk: (p) => svg(p, 300, 170, `<rect x="6" y="6" width="288" height="36" rx="6" ${F("#b07a43")}/><rect x="26" y="42" width="20" height="122" ${F("#8a5a2b")}/><rect x="254" y="42" width="20" height="122" ${F("#8a5a2b")}/>`),
    chair: (p) => svg(p, 150, 230, `<rect x="20" y="6" width="110" height="110" rx="10" ${F("#d9534f")}/><rect x="10" y="116" width="130" height="28" rx="6" ${F("#c0392b")}/><rect x="22" y="144" width="16" height="80" ${F("#555")}/><rect x="112" y="144" width="16" height="80" ${F("#555")}/>`),
    paper: (p) => svg(p, 200, 250, `<rect x="6" y="6" width="188" height="238" rx="6" ${F("#fff")}/><text x="100" y="58" text-anchor="middle" font-family="Hand" font-size="38">${esc(p.text ?? "EXAM")}</text>${[90, 120, 150, 180, 210].map((y) => `<line x1="28" y1="${y}" x2="172" y2="${y}" stroke="#bbb" stroke-width="6" stroke-linecap="round"/>`).join("")}`),
    clock: (p) => {
      const hr = ((p.h ?? 1) % 12 + (p.m ?? 5) / 60) * 30, mn = (p.m ?? 5) * 6;
      const hand = (deg, len, wdt) => `<line x1="80" y1="80" x2="${80 + len * Math.sin((deg * Math.PI) / 180)}" y2="${80 - len * Math.cos((deg * Math.PI) / 180)}" stroke="#111" stroke-width="${wdt}" stroke-linecap="round"/>`;
      return svg(p, 160, 160, `<circle cx="80" cy="80" r="72" ${F("#fff")}/>${[0, 90, 180, 270].map((d) => `<circle cx="${80 + 56 * Math.sin((d * Math.PI) / 180)}" cy="${80 - 56 * Math.cos((d * Math.PI) / 180)}" r="5" fill="#111"/>`).join("")}${hand(hr, 36, 10)}${hand(mn, 54, 7)}<circle cx="80" cy="80" r="7" fill="#111"/>`);
    },
    airplane: (p) => svg(p, 270, 170, `<path d="M10 80 L120 70 L170 10 L195 10 L170 72 L235 70 L250 45 L262 45 L255 80 L262 115 L250 115 L235 90 L170 88 L195 150 L170 150 L120 90 L10 80 Z" ${F("#fff")}/><circle cx="210" cy="80" r="6" fill="#111"/><circle cx="185" cy="80" r="6" fill="#111"/>`),
    glasses: (p) => svg(p, 260, 100, `<rect x="8" y="14" width="100" height="74" rx="22" ${F("#bfe8ff")}/><rect x="152" y="14" width="100" height="74" rx="22" ${F("#bfe8ff")}/><path d="M108 44 Q130 28 152 44" fill="none" stroke="#111" stroke-width="8"/>`),
    sticker: (p) => svg(p, 90, 90, `<rect x="8" y="8" width="74" height="74" rx="10" ${F("#d7ff3a")}/>`),
    cash: (p) => svg(p, 240, 150, [0, 1, 2].map((i) => `<rect x="${10 + i * 8}" y="${70 - i * 26}" width="200" height="70" rx="8" ${F("#7ccf6a")}/><circle cx="${110 + i * 8}" cy="${105 - i * 26}" r="20" ${F("#a8e39b", 5)}/><text x="${110 + i * 8}" y="${118 - i * 26}" text-anchor="middle" font-family="Hand" font-size="36">$</text>`).join("")),
    laptop: (p) => svg(p, 280, 200, `<rect x="40" y="8" width="200" height="140" rx="10" ${F("#333")}/><rect x="54" y="22" width="172" height="112" rx="4" fill="#bfe8ff"/><text x="140" y="90" text-anchor="middle" font-family="Hand" font-size="${p.size ?? 34}">${esc(p.text ?? "")}</text><path d="M8 152 H272 L254 190 H26 Z" ${F("#999")}/>`),
    tv: (p) => svg(p, 300, 240, `<rect x="8" y="8" width="284" height="180" rx="14" ${F("#333")}/><rect x="24" y="24" width="252" height="148" rx="6" fill="${p.screen ?? "#ffe66d"}"/><text x="150" y="112" text-anchor="middle" font-family="Hand" font-size="${p.size ?? 40}">${esc(p.text ?? "")}</text><rect x="130" y="188" width="40" height="30" ${F("#555")}/><rect x="90" y="214" width="120" height="18" rx="6" ${F("#555")}/>`),
    window: (p) => svg(p, 240, 240, `<rect x="8" y="8" width="224" height="224" rx="6" ${F(p.sky ?? "#9be1ff")}/><line x1="120" y1="8" x2="120" y2="232" stroke="#111" stroke-width="8"/><line x1="8" y1="120" x2="232" y2="120" stroke="#111" stroke-width="8"/>`),
    plant: (p) => svg(p, 160, 220, `<path d="M80 120 C 40 90, 20 50, 34 20 C 60 40, 74 80, 80 120 Z" ${F("#3fae5a")}/><path d="M80 120 C 120 90, 140 50, 126 20 C 100 40, 86 80, 80 120 Z" ${F("#3fae5a")}/><path d="M80 120 C 76 80, 78 40, 80 8 C 86 40, 88 80, 80 120 Z" ${F("#4cc26a")}/><path d="M36 120 H124 L112 212 H48 Z" ${F("#e07a3a")}/>`),
    siren: (p) => svg(p, 200, 170, `${[-50, -20, 20, 50].map((a) => `<line x1="${100 + 70 * Math.sin((a * Math.PI) / 180)}" y1="${90 - 70 * Math.cos((a * Math.PI) / 180)}" x2="${100 + 92 * Math.sin((a * Math.PI) / 180)}" y2="${90 - 92 * Math.cos((a * Math.PI) / 180)}" stroke="#111" stroke-width="8" stroke-linecap="round"/>`).join("")}<path d="M50 130 V100 A50 50 0 0 1 150 100 V130 Z" ${F("#ff4d3d")}/><rect x="36" y="128" width="128" height="28" rx="6" ${F("#555")}/>`),
    magnifier: (p) => svg(p, 200, 200, `<line x1="120" y1="120" x2="186" y2="186" stroke="#111" stroke-width="26" stroke-linecap="round"/><line x1="120" y1="120" x2="186" y2="186" stroke="#8a5a2b" stroke-width="12" stroke-linecap="round"/><circle cx="78" cy="78" r="66" ${F("#cdeeff")}/>`),
    trophy: (p) => svg(p, 180, 220, `<path d="M40 14 H140 V70 A50 50 0 0 1 40 70 Z" ${F("#ffcf3a")}/><path d="M40 30 H14 V54 A26 26 0 0 0 40 80 M140 30 H166 V54 A26 26 0 0 1 140 80" fill="none" stroke="#111" stroke-width="8"/><rect x="78" y="118" width="24" height="44" ${F("#ffcf3a")}/><rect x="44" y="160" width="92" height="44" rx="6" ${F("#8a5a2b")}/>`),
    standsign: (p) => svg(p, 240, 250, `<rect x="110" y="120" width="20" height="124" ${F("#8a5a2b")}/><rect x="8" y="8" width="224" height="120" rx="10" ${F("#fff")}/><text x="120" y="${p.text && p.text.includes("\n") ? 58 : 82}" text-anchor="middle" font-family="Hand" font-size="${p.size ?? 42}">${esc(p.text ?? "").split("\n").map((t, i) => `<tspan x="120" dy="${i ? 44 : 0}">${t}</tspan>`).join("")}</text>`),
    cloud: (p) => svg(p, 300, 150, `<path d="M60 130 C 10 130, 10 70, 60 74 C 60 24, 140 14, 160 56 C 190 22, 260 40, 248 88 C 296 92, 290 132, 248 130 Z" ${F("#fff")}/>`),
    door2: (p) => svg(p, 180, 300, `<rect x="8" y="8" width="164" height="284" rx="6" ${F("#8a6a45")}/><circle cx="140" cy="160" r="9" fill="#111"/><rect x="28" y="30" width="124" height="44" rx="4" ${F("#fff", 5)}/><text x="90" y="64" text-anchor="middle" font-family="Hand" font-size="30">${esc(p.text ?? "")}</text>`),
    bag: (p) => svg(p, 180, 200, `<path d="M50 50 A40 40 0 0 1 130 50" fill="none" stroke="#111" stroke-width="10"/><rect x="14" y="48" width="152" height="144" rx="26" ${F("#3a7bd5")}/><rect x="44" y="110" width="92" height="56" rx="10" ${F("#2c62b0")}/>`),
    motion: (p) => svg(p, 120, 120, [0, 1, 2].map((i) => `<path d="M${14 + i * 34} 110 Q ${30 + i * 34} 60 ${18 + i * 34} 10" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>`).join("")),
  };
  function svg(p, vw, vh, inner) {
    const w = p.w ?? vw;
    return `<svg style="position:absolute;left:${p.x}px;top:${p.y}px;rotate:${p.rot ?? 0}deg;${p.flip ? "transform:scaleX(-1);" : ""}overflow:visible" width="${w}" height="${(w * vh) / vw}" viewBox="0 0 ${vw} ${vh}">${inner}</svg>`;
  }
  function F(fill, sw = 7) {
    return `fill="${fill}" stroke="#111" stroke-width="${sw}" stroke-linejoin="round"`;
  }

  // speech tail: a little curved wedge pointing down/left/right from the bubble's bottom edge
  const tail = (t) => {
    if (!t) return "";
    const x = t.x ?? 60;
    const flip = t.dir === "left" ? -1 : 1;
    return `<svg width="60" height="70" viewBox="0 0 60 70" style="left:${x}px;bottom:-62px;transform:scaleX(${flip})"><path d="M8 0 C 14 30, 30 52, 52 66 C 36 40, 34 18, 34 0 Z" fill="#fff" stroke="#111" stroke-width="7" stroke-linejoin="round"/><rect x="10" y="-6" width="22" height="10" fill="#fff"/></svg>`;
  };

  function panel(r, p) {
    const [x, y, w, h] = r;
    const back = (p.props ?? []).filter((q) => !q.front).map((q) => PROPS[q.type](q)).join("");
    const front = (p.props ?? []).filter((q) => q.front).map((q) => PROPS[q.type](q)).join("");
    const blips = (p.blips ?? []).map((b) => `<div class="blip" style="left:${b.x}px;top:${b.y}px;width:${b.size}px;height:${b.size}px;${b.flip ? "transform:scaleX(-1);" : ""}${b.rot ? `rotate:${b.rot}deg;` : ""}"><img src="${BLIP(b.face)}"></div>`).join("");
    const bubbles = (p.bubbles ?? []).map((b) =>
      b.top
        ? `<div class="bubble top" style="padding:${b.pad ?? 26}px 20px;font-size:${b.size ?? 64}px">${br(b.text)}${tail(b.tail)}</div>`
        : `<div class="bubble" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;font-size:${b.size ?? 60}px">${br(b.text)}${tail(b.tail)}</div>`,
    ).join("");
    const floor = p.floor ? `<div class="floor" style="height:${p.floor.h}px;background:${p.floor.color}"></div>` : "";
    return `<div class="frame" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${p.bg ?? "#ffd23f"}">${floor}${back}${blips}${front}${bubbles}</div>`;
  }

  function render(d) {
    const total = d.slides.length;
    document.getElementById("root").innerHTML = d.slides.map((s, i) => {
      const head = `<div class="logo">BLIP CHECK<b>&gt;_</b></div><div class="page">${i + 1}/${total}</div>`;
      if (s.type === "facts")
        return `<section class="slide facts">${head}<h2>${s.title}</h2><ul>${s.items.map((it) => `<li><span class="tag ${it.plan ? "plan" : ""}">${it.plan ? "STILL A PLAN" : "REAL"}</span><br>${esc(it.text)}<small>${esc(it.src)}</small></li>`).join("")}</ul>
          <div class="foot">${esc(s.foot)}</div><div class="blip" style="right:30px;bottom:20px;width:210px;height:210px"><img src="${BLIP(s.face ?? "happy")}"></div></section>`;
      if (s.type === "hook")
        return `<section class="slide hook">${head}<div class="h1">${br(s.line)}</div><div class="h2">${esc(s.lead ?? "")} <span>${esc(s.punch)}</span></div>
          ${(s.props ?? []).map((q) => PROPS[q.type](q)).join("")}
          <div class="blip" style="right:${s.bx ?? 40}px;bottom:${s.by ?? 40}px;width:${s.bsize ?? 380}px;height:${s.bsize ?? 380}px"><img src="${BLIP(s.face ?? "panic")}"></div>
          <div class="true"><b>TRUE STORY</b>swipe →</div></section>`;
      const rects = L[s.layout];
      return `<section class="slide">${head}${s.panels.map((p, k) => panel(rects[k], p)).join("")}</section>`;
    }).join("");
  }
  window.renderComic = render;
</script>
</body>
</html>
