<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blip Comic</title>
<style>
  @font-face { font-family: "Pretendard"; font-weight: 400; src: url("../fonts/Pretendard-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Pretendard"; font-weight: 600; src: url("../fonts/Pretendard-SemiBold.woff2") format("woff2"); }
  @font-face { font-family: "Pretendard"; font-weight: 700; src: url("../fonts/Pretendard-Bold.woff2") format("woff2"); }
  @font-face { font-family: "Pretendard"; font-weight: 900; src: url("../fonts/Pretendard-Black.woff2") format("woff2"); }

  :root {
    --bg: #0a0b0d; --ink: #f5f5f2; --lime: #d7ff3a; --dim: rgba(255,255,255,0.6);
    --paper: #fbfaf5; --line: #111; --red: #ff6b5e; --amber: #ffc93a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; font-family: "Pretendard", sans-serif; }

  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: var(--bg); margin-bottom: 20px; }
  .top { position: absolute; left: 56px; right: 56px; top: 40px; display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 30px; color: var(--ink); }
  .badge { background: var(--lime); color: var(--bg); padding: 6px 14px; border-radius: 10px; font-size: 26px; }
  .page { position: absolute; right: 56px; bottom: 34px; color: var(--dim); font-weight: 700; font-size: 24px; }

  /* the panel: a paper frame with thick ink border */
  .panel { position: absolute; left: 48px; top: 110px; width: 984px; height: 900px; background: var(--paper); border: 8px solid var(--line); border-radius: 18px; overflow: hidden; }
  .panel.sky { background: linear-gradient(#bfe3ff, #eaf6ff 70%, #dfe8d0 70%); }
  .panel.hall { background: linear-gradient(#efe9dd 0 72%, #cdbfa6 72%); }
  .panel.dark { background: radial-gradient(60% 60% at 50% 45%, #2b3415, #0e1108 75%); }
  .panel.money { background: radial-gradient(60% 60% at 50% 40%, #fff6c8, #f3e29a 80%); }

  .caption { position: absolute; left: 0; top: 0; background: var(--amber); color: var(--line); font-weight: 900; font-size: 34px; padding: 14px 24px; border-right: 6px solid var(--line); border-bottom: 6px solid var(--line); border-bottom-right-radius: 14px; max-width: 80%; line-height: 1.2; }

  .blip { position: absolute; }
  .blip img { width: 100%; height: 100%; object-fit: contain; }

  .bubble { position: absolute; background: #fff; color: var(--line); border: 6px solid var(--line); border-radius: 46px; padding: 22px 30px; font-weight: 800; font-size: 40px; line-height: 1.2; text-align: center; }
  .bubble::after { content: ""; position: absolute; width: 0; height: 0; border: 22px solid transparent; }
  .bubble.shout { border-radius: 12px; background: var(--lime); font-weight: 900; }
  .bubble.off { border-style: dashed; }
  .bubble .who { display: block; font-size: 24px; font-weight: 700; color: #555; margin-bottom: 4px; }
  .tail { position: absolute; width: 44px; height: 44px; background: #fff; border-right: 6px solid var(--line); border-bottom: 6px solid var(--line); }
  .shout .tail { background: var(--lime); }

  /* the fact strip under the panel — the only place for facts and numbers */
  .fact { position: absolute; left: 48px; right: 48px; top: 1032px; background: #16181c; border: 2px solid rgba(215,255,58,0.5); border-radius: 18px; padding: 20px 26px; color: var(--ink); }
  .fact .label { display: inline-block; background: var(--lime); color: var(--bg); font-weight: 900; font-size: 22px; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; letter-spacing: 1px; }
  .fact p { font-size: 30px; line-height: 1.38; font-weight: 600; }
  .fact small { display: block; margin-top: 8px; font-size: 21px; color: var(--dim); }
  .fact.plan .label { background: var(--amber); }

  /* cover & end */
  .cover h1 { position: absolute; left: 70px; right: 70px; top: 180px; font-weight: 900; font-size: 104px; line-height: 1.08; color: var(--ink); letter-spacing: -2px; }
  .cover h1 em { font-style: normal; color: var(--lime); }
  .cover .kick { position: absolute; left: 70px; top: 130px; color: var(--lime); font-weight: 900; font-size: 34px; letter-spacing: 2px; }
  .cover .sub { position: absolute; left: 70px; right: 70px; top: 560px; color: var(--dim); font-weight: 700; font-size: 36px; line-height: 1.4; }
  .cover .swipe { position: absolute; left: 70px; bottom: 90px; color: var(--ink); font-weight: 900; font-size: 34px; }
  .end h2 { position: absolute; left: 70px; top: 130px; font-weight: 900; font-size: 64px; color: var(--ink); }
  .rows { position: absolute; left: 70px; right: 70px; top: 250px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; gap: 20px; align-items: flex-start; background: #16181c; border-radius: 16px; padding: 20px 24px; color: var(--ink); font-size: 32px; font-weight: 700; line-height: 1.35; }
  .row .st { flex: none; width: 150px; text-align: center; font-size: 22px; font-weight: 900; padding: 6px 0; border-radius: 8px; }
  .st.real { background: var(--lime); color: var(--bg); } .st.plan { background: var(--amber); color: var(--bg); }
  .srcs { position: absolute; left: 70px; right: 70px; top: 930px; color: var(--dim); font-size: 24px; line-height: 1.5; font-weight: 600; }
  .cta { position: absolute; left: 70px; bottom: 70px; color: var(--ink); font-size: 34px; font-weight: 900; }
  .cta b { color: var(--lime); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const br = (s) => esc(s).replace(/\n/g, "<br>");

  // simple props drawn in code (no stock art)
  const PROPS = {
    plane: (p) => `<svg style="position:absolute;left:${p.x}px;top:${p.y}px;rotate:${p.rot ?? -8}deg" width="${p.w ?? 300}" viewBox="0 0 260 160"><path d="M10 80 L120 70 L170 10 L195 10 L170 72 L235 70 L250 45 L262 45 L255 80 L262 115 L250 115 L235 90 L170 88 L195 150 L170 150 L120 90 L10 80 Z" fill="#2a2f3a"/></svg>`,
    zzz: (p) => `<div style="position:absolute;left:${p.x}px;top:${p.y}px;font:900 ${p.size ?? 60}px Pretendard;color:#2a2f3a">${esc(p.text ?? "…")}</div>`,
    phone: (p) => `<div style="position:absolute;left:${p.x}px;top:${p.y}px;width:${p.w ?? 240}px;height:${(p.w ?? 240) * 1.8}px;border:12px solid #111;border-radius:40px;background:#2a2f1a;box-shadow:0 0 80px #d7ff3a;rotate:${p.rot ?? 8}deg"><div style="margin:40px 14px;background:#ff6b5e;border-radius:14px;padding:14px;font:900 28px Pretendard;color:#fff;text-align:center">EMERGENCY ALERT</div></div>`,
    stickers: (p) => (p.at ?? []).map(([x, y]) => `<div style="position:absolute;left:${x}px;top:${y}px;width:70px;height:70px;background:#d7ff3a;border:5px solid #111;border-radius:12px;rotate:${(x * 7) % 30 - 15}deg"></div>`).join(""),
    door: (p) => `<div style="position:absolute;left:${p.x}px;top:${p.y}px;width:300px;height:560px;background:#8a6a45;border:8px solid #111;border-radius:10px"><div style="position:absolute;right:26px;top:270px;width:30px;height:30px;border-radius:50%;background:#111"></div><div style="position:absolute;left:30px;top:40px;right:30px;background:#fff;border:4px solid #111;font:900 30px Pretendard;text-align:center;padding:8px">EXAM ROOM</div></div>`,
    sign: (p) => `<div style="position:absolute;left:${p.x}px;top:${p.y}px;background:#111;color:#d7ff3a;font:900 ${p.size ?? 120}px Pretendard;padding:10px 30px;border-radius:18px;white-space:nowrap;rotate:${p.rot ?? -4}deg">${esc(p.text)}</div>`,
    lines: (p) => `<div style="position:absolute;left:${p.x}px;top:${p.y}px;font:900 ${p.size ?? 70}px Pretendard;color:${p.color ?? "#111"};rotate:${p.rot ?? 0}deg">${esc(p.text ?? "! !")}</div>`,
  };

  const tail = (dir) => {
    // dir: "bl" | "br" | "tl" | "tr" (where the tail points from the bubble)
    const pos = { bl: "left:60px;bottom:-26px;rotate:45deg", br: "right:60px;bottom:-26px;rotate:45deg", tl: "left:60px;top:-26px;rotate:-135deg", tr: "right:60px;top:-26px;rotate:-135deg" }[dir];
    return pos ? `<div class="tail" style="${pos}"></div>` : "";
  };

  function panel(s) {
    const blips = (s.blips ?? []).map((b) => `<div class="blip" style="left:${b.x}px;top:${b.y}px;width:${b.size}px;height:${b.size}px;${b.flip ? "transform:scaleX(-1);" : ""}${b.rot ? `rotate:${b.rot}deg;` : ""}"><img src="../../video/public/bc01/blip/${b.face}.png"></div>`).join("");
    const props = (s.props ?? []).filter((p) => !p.front).map((p) => PROPS[p.type](p)).join("");
    const front = (s.props ?? []).filter((p) => p.front).map((p) => PROPS[p.type](p)).join("");
    const bubbles = (s.bubbles ?? []).map((b) => `<div class="bubble ${b.style ?? ""}" style="left:${b.x}px;top:${b.y}px;width:${b.w ?? 420}px">${b.who ? `<span class="who">${esc(b.who)}</span>` : ""}${br(b.text)}${tail(b.tail)}</div>`).join("");
    return `<div class="panel ${s.scene ?? ""}">${props}${blips}${front}${bubbles}${s.caption ? `<div class="caption">${br(s.caption)}</div>` : ""}</div>`;
  }

  function render(d) {
    const total = d.slides.length;
    const top = `<div class="top"><span>${esc(d.series)}</span><span class="badge">BLIP CHECK &gt;_</span></div>`;
    document.getElementById("root").innerHTML = d.slides.map((s, i) => {
      const page = `<div class="page">${i + 1} / ${total}</div>`;
      if (s.type === "cover")
        return `<section class="slide cover">${top}<div class="kick">${esc(s.kicker)}</div><h1>${s.title}</h1><div class="sub">${br(s.sub)}</div>
          <div class="blip" style="left:560px;top:760px;width:480px;height:480px"><img src="../../video/public/bc01/blip/${s.face ?? "shock"}.png"></div>
          <div class="swipe">Swipe →</div>${page}</section>`;
      if (s.type === "end")
        return `<section class="slide end">${top}<h2>${esc(s.title)}</h2><div class="rows">${s.rows.map((r) => `<div class="row"><span class="st ${r.st}">${r.st === "real" ? "REAL" : "STILL A PLAN"}</span><span>${esc(r.text)}</span></div>`).join("")}</div>
          <div class="srcs">${esc(s.sources)}</div><div class="cta">${s.cta}</div>${page}</section>`;
      const fact = s.fact ? `<div class="fact ${s.fact.plan ? "plan" : ""}"><span class="label">${s.fact.plan ? "STILL A PLAN" : "FACT"}</span><p>${esc(s.fact.text)}</p><small>Source: ${esc(s.fact.src)}</small></div>` : "";
      return `<section class="slide">${top}${panel(s)}${fact}${page}</section>`;
    }).join("");
  }
  window.renderComic = render;
</script>
</body>
</html>
